<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#F6F5FB" />
    <title>DuckMind — Mergulhe nos estudos.</title>
    <meta name="description" content="Plataforma completa de estudos e preparação para o ENEM com cronômetro, edital completo, simulados, redação, estatísticas e caderno de erros." />
    <meta property="og:title" content="DuckMind — Plataforma de Estudos para o ENEM" />
    <meta property="og:description" content="Plataforma completa de estudos e preparação para o ENEM com cronômetro, edital completo, simulados, redação, estatísticas e caderno de erros." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DuckMind — Plataforma de Estudos para o ENEM" />
    <meta name="twitter:description" content="Plataforma completa de estudos e preparação para o ENEM com cronômetro, edital completo, simulados, redação, estatísticas e caderno de erros." />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('duckmind-theme') || 'light';
          if (mode === 'dark') {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0D0A1F');
          }
        } catch (e) {}
      })();
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
